name: Scout checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STUDIO_TEST_POSTGRES_URL: postgresql+psycopg://studio_test:test-only@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          version: '0.13.6'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests migrations
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic upgrade head
