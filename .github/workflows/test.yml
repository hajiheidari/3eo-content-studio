name: Foundation checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg util-linux fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts migrations
      - run: uv run alembic upgrade head
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  motion-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: motion-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
